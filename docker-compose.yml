version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: ${POSTGRES_CONTAINER_NAME:-bitcoin-nodes-postgres}
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-bitcoin_nodes}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - bitcoin-nodes-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-bitcoin_nodes}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional: pgAdmin for PostgreSQL web UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bitcoin-nodes-pgadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bitcoin-nodes-network

  # Optional: API service (uncomment to run the API in Docker too)
  # api:
  #   build: .
  #   container_name: bitcoin-nodes-api
  #   restart: unless-stopped
  #   ports:
  #     - "${SERVER_PORT:-8080}:8080"
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DATABASE:-bitcoin_nodes}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - bitcoin-nodes-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  bitcoin-nodes-network:
    driver: bridge
