[package]
name = "bitcoin-nodes-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
chrono = { version = "0.4.41", features = ["serde"]}
cron = "0.15.0"
diesel = { version = "2.2.12", features = ["postgres", "chrono", "serde_json", "uuid", "r2d2"] }
diesel_migrations = "2.2.0"
dotenvy = "0.15.7"
env_logger = "0.11.8"
reqwest = {version = "0.12.22", features = ["json"] }
serde = "1.0.219"
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["full"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
